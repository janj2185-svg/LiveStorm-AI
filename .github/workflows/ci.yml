name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck frontend
        run: pnpm typecheck
      - name: Test frontend
        run: pnpm test
      - name: Build frontend
        run: pnpm build

  flutter-linux-android-web:
    name: Flutter Linux, Android and Web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/sylora
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true
      - name: Install Linux desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev libstdc++-14-dev
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze Flutter
        run: flutter analyze
      - name: Test Flutter
        run: flutter test
      - name: Build Flutter Web
        run: flutter build web --release --dart-define=SYLORA_API_BASE_URL=https://api.example.invalid
      - name: Build Flutter Linux
        run: flutter build linux --release --dart-define=SYLORA_API_BASE_URL=https://api.example.invalid
      - name: Build runnable Android debug APK
        run: flutter build apk --debug --dart-define=SYLORA_API_BASE_URL=http://10.0.2.2:8000
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-linux-android-web
          if-no-files-found: error
          path: |
            apps/sylora/build/web
            apps/sylora/build/linux/x64/release/bundle
            apps/sylora/build/app/outputs/flutter-apk/app-debug.apk

  flutter-apple:
    name: Flutter iOS and macOS compile
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/sylora
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS without signing
        run: flutter build ios --release --no-codesign --dart-define=SYLORA_API_BASE_URL=https://api.example.invalid
      - name: Build macOS
        run: flutter build macos --release --dart-define=SYLORA_API_BASE_URL=https://api.example.invalid

  flutter-windows:
    name: Flutter Windows compile
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/sylora
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=SYLORA_API_BASE_URL=https://api.example.invalid

  gift-tools:
    name: Gift runtime and Studio
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            packages/gift-runtime/package-lock.json
            apps/gift-studio/package-lock.json
      - name: Verify gift runtime
        working-directory: packages/gift-runtime
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
          npm test
          npm run build
      - name: Verify Gift Studio
        working-directory: apps/gift-studio
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
          npm test
          npm run build

  obs-companion:
    name: OBS companion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/companion/pyproject.toml
      - name: Install companion
        working-directory: services/companion
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e '.[dev]'
      - name: Lint and typecheck companion
        working-directory: services/companion
        run: |
          ruff check .
          mypy src
      - name: Test companion
        working-directory: services/companion
        run: pytest

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sylora_test
          POSTGRES_USER: sylora
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sylora -d sylora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://sylora:ci-only-password@127.0.0.1:5432/sylora_test
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      JWT_SECRET: ci-only-high-entropy-value-32-characters-minimum
      DATA_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      RUN_EXTERNAL_INTEGRATION_TESTS: "1"
      SYLORA_INTEGRATION_DATABASE_URL: postgresql+asyncpg://sylora:ci-only-password@127.0.0.1:5432/sylora_test
      SYLORA_INTEGRATION_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v7
      - name: Require backend project
        run: |
          test -f services/api/pyproject.toml || {
            echo "::error::services/api/pyproject.toml is missing; backend CI cannot run"
            exit 1
          }
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: services/api
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip setuptools wheel
          python -m pip install --disable-pip-version-check -e ".[test]"
      - name: Lint backend
        working-directory: services/api
        run: ruff check .
      - name: Typecheck backend
        working-directory: services/api
        run: mypy app
      - name: Apply migrations
        working-directory: services/api
        run: alembic upgrade head
      - name: Test backend with PostgreSQL and Redis integration
        working-directory: services/api
        run: pytest -q
      - name: Verify migration model drift
        working-directory: services/api
        run: alembic check

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan committed content for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - name: Audit frontend production dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level high
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Audit backend dependencies
        run: |
          test -f services/api/pyproject.toml || {
            echo "::error::services/api/pyproject.toml is missing; backend audit cannot run"
            exit 1
          }
          python -m pip install --disable-pip-version-check --upgrade pip setuptools wheel
          python -m pip install --disable-pip-version-check ./services/api ./services/companion
          python -m pip install --disable-pip-version-check pip-audit bandit
          pip-audit
          bandit -r services/api/app services/companion/src -ll -q
      - name: Scan filesystem dependencies and configuration
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  container:
    name: API container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Require API build context
        run: |
          test -f services/api/pyproject.toml || {
            echo "::error::services/api is missing; the API image cannot be built"
            exit 1
          }
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: services/api
          file: infrastructure/docker/api.Dockerfile
          push: false
          load: false
          tags: sylora-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  manifests:
    name: Infrastructure manifests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install static validators
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Validate YAML and JSON
        run: python infrastructure/scripts/validate-static.py
      - name: Validate shell scripts
        run: |
          shopt -s globstar nullglob
          scripts=(infrastructure/**/*.sh)
          shellcheck "${scripts[@]}"
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done
      - uses: azure/setup-kubectl@v4
        with:
          version: latest
      - name: Render Kubernetes overlays
        run: |
          kubectl kustomize infrastructure/kubernetes/overlays/development > /tmp/development.yaml
          kubectl kustomize infrastructure/kubernetes/overlays/production > /tmp/production.yaml
          docker run --rm \
            -v /tmp:/manifests:ro \
            ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -summary -kubernetes-version 1.32.0 \
            /manifests/development.yaml /manifests/production.yaml
      - name: Validate Compose model
        run: |
          cp infrastructure/.env.example infrastructure/.env
          docker compose \
            --env-file infrastructure/.env \
            -f infrastructure/compose/compose.yml \
            config --quiet
      - name: Validate Prometheus configuration
        run: |
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/infrastructure/observability:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 \
            check config /etc/prometheus/prometheus.yml
      - name: Validate workflows
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            rhysd/actionlint:1.7.7
