name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck frontend
        run: pnpm typecheck
      - name: Test frontend
        run: pnpm test
      - name: Build frontend
        run: pnpm build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sylora_test
          POSTGRES_USER: sylora
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sylora -d sylora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://sylora:ci-only-password@127.0.0.1:5432/sylora_test
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      JWT_SECRET: ci-only-high-entropy-value-32-characters-minimum
      DATA_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
    steps:
      - uses: actions/checkout@v7
      - name: Require backend project
        run: |
          test -f services/api/pyproject.toml || {
            echo "::error::services/api/pyproject.toml is missing; backend CI cannot run"
            exit 1
          }
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: services/api
        run: python -m pip install --disable-pip-version-check -e ".[test]"
      - name: Lint backend
        working-directory: services/api
        run: ruff check .
      - name: Typecheck backend
        working-directory: services/api
        run: mypy app
      - name: Test backend
        working-directory: services/api
        run: pytest -q
      - name: Apply and verify migrations
        working-directory: services/api
        run: |
          alembic upgrade head
          alembic check

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan committed content for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - name: Audit frontend production dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level high
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Audit backend dependencies
        run: |
          test -f services/api/pyproject.toml || {
            echo "::error::services/api/pyproject.toml is missing; backend audit cannot run"
            exit 1
          }
          python -m pip install --disable-pip-version-check ./services/api
          python -m pip install --disable-pip-version-check pip-audit
          pip-audit
      - name: Scan filesystem dependencies and configuration
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  container:
    name: API container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Require API build context
        run: |
          test -f services/api/pyproject.toml || {
            echo "::error::services/api is missing; the API image cannot be built"
            exit 1
          }
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: services/api
          file: infrastructure/docker/api.Dockerfile
          push: false
          load: false
          tags: sylora-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  manifests:
    name: Infrastructure manifests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install static validators
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Validate YAML and JSON
        run: python infrastructure/scripts/validate-static.py
      - name: Validate shell scripts
        run: |
          shopt -s globstar nullglob
          scripts=(infrastructure/**/*.sh)
          shellcheck "${scripts[@]}"
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done
      - uses: azure/setup-kubectl@v4
        with:
          version: latest
      - name: Render Kubernetes overlays
        run: |
          kubectl kustomize infrastructure/kubernetes/overlays/development > /tmp/development.yaml
          kubectl kustomize infrastructure/kubernetes/overlays/production > /tmp/production.yaml
          docker run --rm \
            -v /tmp:/manifests:ro \
            ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -summary -kubernetes-version 1.32.0 \
            /manifests/development.yaml /manifests/production.yaml
      - name: Validate Compose model
        run: |
          cp infrastructure/.env.example infrastructure/.env
          docker compose \
            --env-file infrastructure/.env \
            -f infrastructure/compose/compose.yml \
            config --quiet
      - name: Validate Prometheus configuration
        run: |
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/infrastructure/observability:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 \
            check config /etc/prometheus/prometheus.yml
      - name: Validate workflows
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            rhysd/actionlint:1.7.7
