[extend]
useDefault = true

[allowlist]
description = "Reviewed non-secrets: tests, templates, and environment references"
regexTarget = "line"
paths = [
  '''services/api/tests/.*''',
  '''infrastructure/\.env\.example''',
]
regexes = [
  '''(?i)key:\s*RECORDING_S3_(BUCKET|PREFIX)''',
  '''curl\s+-fsS\s+-u\s+"elastic:\$\$\{ELASTIC_PASSWORD\}"''',
]
