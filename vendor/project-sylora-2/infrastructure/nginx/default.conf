# Cloudflare / direct origin reverse proxy for Sylora
map $http_x_forwarded_proto $sylora_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream sylora_frontend {
    server frontend:3000;
}

upstream sylora_api {
    server api:8000;
}

# Shared ACME challenge location (Cloudflare Full/Full Strict proxies
# HTTP-01 validation to origin over HTTPS).
# Include-like duplication kept explicit for clarity in one file.

server {
    listen 80;
    listen [::]:80;
    server_name getsylora.com www.getsylora.com 46.225.84.210 _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location /health {
        proxy_pass http://sylora_api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $sylora_forwarded_proto;
    }

    location /v1/ {
        proxy_pass http://sylora_api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $sylora_forwarded_proto;
    }

    location / {
        proxy_pass http://sylora_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $sylora_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name getsylora.com www.getsylora.com 46.225.84.210 _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location /health {
        proxy_pass http://sylora_api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $sylora_forwarded_proto;
    }

    location /v1/ {
        proxy_pass http://sylora_api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $sylora_forwarded_proto;
    }

    location / {
        proxy_pass http://sylora_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $sylora_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
