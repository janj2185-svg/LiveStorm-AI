<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="SYLORA">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#FFF7EE"/>
      <stop offset="100%" stop-color="#E6C88B"/>
    </radialGradient>
    <linearGradient id="p0" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5DEB3" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E6C88B" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="p1" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9A45C" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#8EB8D8" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="p2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#DCEEFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E6C88B" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
