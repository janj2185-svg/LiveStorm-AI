    <ellipse rx="18" ry="34" fill="url(#p1)" opacity="0.82" transform="rotate(60)" filter="url(#soft)"/>
    <ellipse rx="18" ry="34" fill="url(#p2)" opacity="0.8" transform="rotate(120)" filter="url(#soft)"/>
    <ellipse rx="18" ry="34" fill="url(#p0)" opacity="0.72" transform="rotate(180)" filter="url(#soft)"/>
    <ellipse rx="18" ry="34" fill="url(#p1)" opacity="0.7" transform="rotate(240)" filter="url(#soft)"/>
    <ellipse rx="18" ry="34" fill="url(#p2)" opacity="0.68" transform="rotate(300)" filter="url(#soft)"/>
