<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="SYLORA">
  <!-- Infinity Core — AI · intellect · connection · infinity · creativity · digital universe -->
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="42%" stop-color="#FFF7EE"/>
      <stop offset="78%" stop-color="#E6C88B"/>
      <stop offset="100%" stop-color="#8EB8D8" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5DEB3"/>
      <stop offset="35%" stop-color="#E6C88B"/>
      <stop offset="68%" stop-color="#C9A45C"/>
      <stop offset="100%" stop-color="#8EB8D8"/>
    </linearGradient>
    <linearGradient id="ribbonSoft" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DCEEFF" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#E6C88B" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#F5DEB3" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="softBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <filter id="coreBlur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <!-- Quiet field -->
  <circle cx="64" cy="64" r="60" fill="#FFF7EE"/>

  <!-- Outer universe orbit -->
  <circle cx="64" cy="64" r="52" fill="none" stroke="#C9A45C" stroke-opacity="0.22" stroke-width="1"/>
  <circle cx="64" cy="64" r="44" fill="none" stroke="#8EB8D8" stroke-opacity="0.18" stroke-width="0.8" stroke-dasharray="2.5 3.5"/>

  <!-- Infinity ribbon (lemniscate) — connection + continuity -->
  <g transform="translate(64 64)" filter="url(#softBlur)">
    <path
      d="M0,0
         C14,-22 38,-22 38,0
         C38,22 14,22 0,0
         C-14,-22 -38,-22 -38,0
         C-38,22 -14,22 0,0 Z"
      fill="none"
      stroke="url(#ribbon)"
      stroke-width="7.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.42"/>
    <path
      d="M0,0
         C12,-18 34,-18 34,0
         C34,18 12,18 0,0
         C-12,-18 -34,-18 -34,0
         C-34,18 -12,18 0,0"
      fill="none"
      stroke="url(#ribbonSoft)"
      stroke-width="4.2"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.95"/>
  </g>

  <!-- Neural nodes on the ribbon (human intellect + AI) -->
  <g fill="#C9A45C">
    <circle cx="30" cy="64" r="2.4" opacity="0.85"/>
    <circle cx="98" cy="64" r="2.4" opacity="0.85"/>
    <circle cx="48" cy="48" r="1.7" opacity="0.7"/>
    <circle cx="80" cy="80" r="1.7" opacity="0.7"/>
    <circle cx="48" cy="80" r="1.5" opacity="0.55"/>
    <circle cx="80" cy="48" r="1.5" opacity="0.55"/>
  </g>

  <!-- Energy core -->
  <circle cx="64" cy="64" r="14" fill="url(#coreGlow)" filter="url(#coreBlur)" opacity="0.55"/>
  <circle cx="64" cy="64" r="11" fill="url(#coreGlow)"/>
  <circle cx="64" cy="64" r="5.2" fill="#FFFFFF" opacity="0.96"/>
  <circle cx="64" cy="64" r="16.5" fill="none" stroke="#E6C88B" stroke-opacity="0.45" stroke-width="1.2"/>
</svg>
