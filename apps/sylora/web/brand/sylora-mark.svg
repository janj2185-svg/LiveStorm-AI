    <radialGradient id="nebulaB" cx="62%" cy="58%" r="38%">
      <stop offset="0%" stop-color="#B39CFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#B39CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaC" cx="48%" cy="68%" r="32%">
      <stop offset="0%" stop-color="#E6C88B" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#E6C88B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sigilPearl" x1="36" y1="24" x2="98" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EAF6FF"/>
      <stop offset="28%" stop-color="#7EC8FF"/>
      <stop offset="52%" stop-color="#9B8CFF"/>
      <stop offset="78%" stop-color="#E6C88B"/>
      <stop offset="100%" stop-color="#FFF0D2"/>
    </linearGradient>
    <linearGradient id="sigilEdge" x1="30" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.65"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <clipPath id="orbClip">
      <circle cx="64" cy="64" r="46"/>
    </clipPath>
  </defs>

  <circle cx="64" cy="64" r="60" fill="url(#orbAura)"/>
  <circle cx="64" cy="64" r="48" fill="url(#orbGlass)"/>
  <g clip-path="url(#orbClip)">
