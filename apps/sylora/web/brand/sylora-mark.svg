<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="SYLORA">
  <!-- SYLORA UNIFIED — Liquid S in glowing orb (founder lock) -->
  <defs>
    <radialGradient id="orbAura" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#B8C8FF" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#8B7CFF" stop-opacity="0.18"/>
      <stop offset="75%" stop-color="#5EC8FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#E6C88B" stop-opacity="0"/>
