<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="SYLORA">
  <!-- SYLORA Ethereal — twin-ribbon Liquid S (cyan + gold) -->
  <defs>
    <linearGradient id="ribbonGold" x1="28" y1="18" x2="104" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF4D2"/>
      <stop offset="35%" stop-color="#F5DEB3"/>
      <stop offset="70%" stop-color="#E6C88B"/>
      <stop offset="100%" stop-color="#C9A45C"/>
    </linearGradient>
    <linearGradient id="ribbonCyan" x1="22" y1="14" x2="100" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8FBFF"/>
      <stop offset="30%" stop-color="#A8E4FF"/>
      <stop offset="65%" stop-color="#5EC8FF"/>
      <stop offset="100%" stop-color="#1A8FB5"/>
    </linearGradient>
    <radialGradient id="sigilOrb" cx="50%" cy="48%" r="52%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.78"/>
      <stop offset="32%" stop-color="#5EC8FF" stop-opacity="0.26"/>
      <stop offset="58%" stop-color="#8B7CFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#E6C88B" stop-opacity="0"/>
    </radialGradient>
    <filter id="sigilGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
    <filter id="ribbonSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
  </defs>
  <circle cx="64" cy="64" r="54" fill="url(#sigilOrb)"/>
  <!-- Gold ribbon (rear) -->
  <path
    d="M90 30 C108 28 114 50 94 58 C70 68 42 66 40 86 C38 108 68 118 96 108"
    stroke="#C9A45C"
    stroke-width="15"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.22"
    filter="url(#sigilGlow)"/>
  <path
    d="M90 30 C108 28 114 50 94 58 C70 68 42 66 40 86 C38 108 68 118 96 108"
    stroke="url(#ribbonGold)"
    stroke-width="11.5"
    stroke-linecap="round"
    stroke-linejoin="round"/>
  <!-- Cyan ribbon (front, intertwined offset) -->
  <path
    d="M84 26 C64 14 34 18 32 40 C30 58 54 62 68 66 C86 70 100 76 98 90 C96 108 66 114 42 100"
    stroke="#5EC8FF"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.2"
    filter="url(#sigilGlow)"/>
  <path
    d="M84 26 C64 14 34 18 32 40 C30 58 54 62 68 66 C86 70 100 76 98 90 C96 108 66 114 42 100"
    stroke="url(#ribbonCyan)"
    stroke-width="10.5"
    stroke-linecap="round"
    stroke-linejoin="round"/>
  <path
    d="M84 26 C64 14 34 18 32 40 C30 58 54 62 68 66 C86 70 100 76 98 90 C96 108 66 114 42 100"
    stroke="#FFFFFF"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.55"
    filter="url(#ribbonSoft)"/>
  <circle cx="78" cy="30" r="3.2" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="48" cy="86" r="2.4" fill="#F5DEB3" opacity="0.85"/>
</svg>
