[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "sylora-companion"
version = "0.1.0"
description = "Local, authenticated SYLORA companion for OBS Studio"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "cryptography>=46.0.7,<47",
  "fastapi>=0.141.1,<0.142",
  "httpx>=0.28.1,<0.29",
  "keyring>=25.7.0,<26",
  "prometheus-client>=0.23.1,<0.24",
  "pydantic>=2.12.5,<3",
  "uvicorn[standard]>=0.52.0,<0.53",
  "websockets>=17.0,<18",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.19.1,<2",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4.0,<2",
  "ruff>=0.14.14,<0.15",
]

[project.scripts]
sylora-companion = "sylora_companion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sylora_companion"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["sylora_companion"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["keyring", "keyring.errors"]
ignore_missing_imports = true
