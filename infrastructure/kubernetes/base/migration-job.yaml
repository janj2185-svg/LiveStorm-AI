apiVersion: batch/v1
kind: Job
metadata:
  name: sylora-migrate
  labels:
    app.kubernetes.io/name: sylora-api
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sylora-api
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: sylora-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: sylora-api:replace-with-immutable-tag
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: sylora-api-config
            - secretRef:
                name: sylora-api-secrets
          env:
            - name: HOME
              value: /tmp
            - name: PYTHONPYCACHEPREFIX
              value: /tmp/pycache
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
