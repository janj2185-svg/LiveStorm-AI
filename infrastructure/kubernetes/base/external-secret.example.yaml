# Optional template; excluded from kustomization.yaml until External Secrets
# Operator is installed and the ClusterSecretStore is configured.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sylora-api
  namespace: sylora
spec:
  refreshInterval: 1h
  refreshPolicy: Periodic
  secretStoreRef:
    kind: ClusterSecretStore
    name: sylora-production
  target:
    name: sylora-api-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: sylora/production/database-url
    - secretKey: REDIS_URL
      remoteRef:
        key: sylora/production/redis-url
    - secretKey: CELERY_BROKER_URL
      remoteRef:
        key: sylora/production/celery-broker-url
    - secretKey: CELERY_RESULT_BACKEND
      remoteRef:
        key: sylora/production/celery-result-backend
    - secretKey: ELASTICSEARCH_USERNAME
      remoteRef:
        key: sylora/production/elasticsearch-username
    - secretKey: ELASTICSEARCH_PASSWORD
      remoteRef:
        key: sylora/production/elasticsearch-password
    - secretKey: S3_ACCESS_KEY_ID
      remoteRef:
        key: sylora/production/s3-access-key-id
    - secretKey: S3_SECRET_ACCESS_KEY
      remoteRef:
        key: sylora/production/s3-secret-access-key
    - secretKey: JWT_SECRET
      remoteRef:
        key: sylora/production/jwt-secret
    - secretKey: DATA_ENCRYPTION_KEY
      remoteRef:
        key: sylora/production/data-encryption-key
    - secretKey: IP_HASH_KEY
      remoteRef:
        key: sylora/production/ip-hash-key
    - secretKey: SMTP_USERNAME
      remoteRef:
        key: sylora/production/smtp-username
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: sylora/production/smtp-password
