apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sylora-mediamtx
  labels:
    app.kubernetes.io/name: sylora-mediamtx
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: sylora-mediamtx
  minReplicas: 1
  maxReplicas: 1
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
