apiVersion: v1
kind: ConfigMap
metadata:
  name: sylora-api-config
data:
  ENVIRONMENT: production
  LOG_FORMAT: json
  LOG_LEVEL: INFO
  API_WORKERS: "2"
  CORS_ORIGINS: '["https://app.example.invalid"]'
  ALLOWED_HOSTS: '["api.example.invalid"]'
  WEB_BASE_URL: https://app.example.invalid
  JWT_ISSUER: https://api.example.invalid
  JWT_AUDIENCE: sylora-production
  KAFKA_BOOTSTRAP_SERVERS: kafka.managed.example.invalid:9092
  ELASTICSEARCH_URL: https://elasticsearch.managed.example.invalid
  MILVUS_URI: https://milvus.managed.example.invalid
  S3_ENDPOINT_URL: https://s3.managed.example.invalid
  S3_BUCKET: sylora-private
  SMTP_HOST: smtp.managed.example.invalid
  SMTP_PORT: "587"
  SMTP_FROM_EMAIL: no-reply@example.invalid
  SMTP_START_TLS: "true"
  SMTP_USE_TLS: "false"
  OTEL_SERVICE_NAME: sylora-api
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_TRACES_SAMPLER: parentbased_traceidratio
  OTEL_TRACES_SAMPLER_ARG: "0.1"
