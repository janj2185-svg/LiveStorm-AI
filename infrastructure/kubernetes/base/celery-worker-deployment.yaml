apiVersion: apps/v1
kind: Deployment
metadata:
  name: sylora-celery-worker
  labels:
    app.kubernetes.io/name: sylora-celery-worker
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sylora-celery-worker
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sylora-celery-worker
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: sylora-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sylora-celery-worker
              app.kubernetes.io/component: worker
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: sylora-celery-worker
                    app.kubernetes.io/component: worker
      containers:
        - name: worker
          image: sylora-api:replace-with-immutable-tag
          imagePullPolicy: IfNotPresent
          command: ["celery"]
          args:
            - -A
            - app.celery_app
            - worker
            - --loglevel=INFO
            - --concurrency=4
            - --max-tasks-per-child=1000
          envFrom:
            - configMapRef:
                name: sylora-api-config
            - secretRef:
                name: sylora-api-secrets
          env:
            - name: HOME
              value: /tmp
            - name: PYTHONPYCACHEPREFIX
              value: /tmp/pycache
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            exec:
              command:
                - sh
                - -ec
                - celery -A app.celery_app inspect ping --destination "celery@$HOSTNAME" --timeout=5 | grep -q pong
            periodSeconds: 10
            timeoutSeconds: 8
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - celery -A app.celery_app inspect ping --destination "celery@$HOSTNAME" --timeout=5 | grep -q pong
            periodSeconds: 30
            timeoutSeconds: 8
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - celery -A app.celery_app inspect ping --destination "celery@$HOSTNAME" --timeout=5 | grep -q pong
            periodSeconds: 60
            timeoutSeconds: 8
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 15"]
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
