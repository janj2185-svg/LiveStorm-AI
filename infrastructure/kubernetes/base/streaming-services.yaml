apiVersion: v1
kind: Service
metadata:
  name: sylora-mediamtx
  labels:
    app.kubernetes.io/name: sylora-mediamtx
    app.kubernetes.io/component: media-plane
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sylora-mediamtx
    app.kubernetes.io/component: media-plane
  ports:
    - name: api
      port: 9997
      targetPort: api
      protocol: TCP
    - name: metrics
      port: 9998
      targetPort: metrics
      protocol: TCP
    - name: upload-metrics
      port: 5572
      targetPort: upload-metrics
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: sylora-mediamtx-public
  labels:
    app.kubernetes.io/name: sylora-mediamtx
    app.kubernetes.io/component: media-edge
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: sylora-mediamtx
    app.kubernetes.io/component: media-plane
  ports:
    - name: rtmp
      port: 1935
      targetPort: rtmp
      protocol: TCP
    - name: hls
      port: 8888
      targetPort: hls
      protocol: TCP
    - name: webrtc
      port: 8889
      targetPort: webrtc
      protocol: TCP
    - name: playback
      port: 9996
      targetPort: playback
      protocol: TCP
    - name: webrtc-ice
      port: 8189
      targetPort: webrtc-ice
      protocol: UDP
    - name: srt
      port: 8890
      targetPort: srt
      protocol: UDP
---
