apiVersion: apps/v1
kind: Deployment
metadata:
  name: sylora-coturn
  labels:
    app.kubernetes.io/name: sylora-coturn
    app.kubernetes.io/component: nat-traversal
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sylora-coturn
      app.kubernetes.io/component: nat-traversal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sylora-coturn
        app.kubernetes.io/component: nat-traversal
    spec:
      serviceAccountName: sylora-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: coturn
          image: coturn/coturn:4.16.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - /etc/coturn/start-coturn.sh
          ports:
            - name: turn-tcp
              containerPort: 3478
              protocol: TCP
            - name: turn-udp
              containerPort: 3478
              protocol: UDP
            - name: metrics
              containerPort: 9641
              protocol: TCP
          env:
            - name: TURN_REALM
              valueFrom:
                configMapKeyRef:
                  name: sylora-streaming-config
                  key: TURN_REALM
            - name: TURN_PUBLIC_IP
              valueFrom:
                configMapKeyRef:
                  name: sylora-streaming-config
                  key: TURN_PUBLIC_IP
            - name: TURN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sylora-streaming-secrets
                  key: turn-username
            - name: TURN_SECRET
              valueFrom:
                secretKeyRef:
                  name: sylora-streaming-secrets
                  key: turn-secret
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "2"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: streaming-config
              mountPath: /etc/coturn/turnserver.conf
              subPath: turnserver.conf
              readOnly: true
            - name: streaming-config
              mountPath: /etc/coturn/start-coturn.sh
              subPath: start-coturn.sh
              readOnly: true
            - name: coturn-tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /
              port: metrics
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: metrics
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: streaming-config
          configMap:
            name: sylora-streaming-config
            defaultMode: 0555
        - name: coturn-tmp
          emptyDir:
            sizeLimit: 16Mi
