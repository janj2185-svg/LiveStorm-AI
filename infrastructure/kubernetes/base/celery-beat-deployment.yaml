apiVersion: apps/v1
kind: Deployment
metadata:
  name: sylora-celery-beat
  labels:
    app.kubernetes.io/name: sylora-celery-beat
    app.kubernetes.io/component: scheduler
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sylora-celery-beat
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sylora-celery-beat
        app.kubernetes.io/component: scheduler
    spec:
      serviceAccountName: sylora-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: beat
          image: sylora-api:replace-with-immutable-tag
          imagePullPolicy: IfNotPresent
          command: ["celery"]
          args:
            - -A
            - app.celery_app
            - beat
            - --loglevel=INFO
            - --schedule=/tmp/celerybeat-schedule
          envFrom:
            - configMapRef:
                name: sylora-api-config
            - secretRef:
                name: sylora-api-secrets
          env:
            - name: HOME
              value: /tmp
            - name: PYTHONPYCACHEPREFIX
              value: /tmp/pycache
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            exec:
              command: ["sh", "-ec", "kill -0 1"]
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            exec:
              command: ["sh", "-ec", "kill -0 1"]
            periodSeconds: 20
          livenessProbe:
            exec:
              command: ["sh", "-ec", "kill -0 1"]
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
