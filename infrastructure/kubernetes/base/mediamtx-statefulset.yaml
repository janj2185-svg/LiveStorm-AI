apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sylora-mediamtx
  labels:
    app.kubernetes.io/name: sylora-mediamtx
    app.kubernetes.io/component: media-plane
spec:
  serviceName: sylora-mediamtx
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: sylora-mediamtx
      app.kubernetes.io/component: media-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sylora-mediamtx
        app.kubernetes.io/component: media-plane
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9998"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: sylora-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mediamtx
          image: bluenviron/mediamtx:1.19.3-ffmpeg
          imagePullPolicy: IfNotPresent
          ports:
            - name: rtmp
              containerPort: 1935
              protocol: TCP
            - name: hls
              containerPort: 8888
              protocol: TCP
            - name: webrtc
              containerPort: 8889
              protocol: TCP
            - name: playback
              containerPort: 9996
              protocol: TCP
            - name: api
              containerPort: 9997
              protocol: TCP
            - name: metrics
              containerPort: 9998
              protocol: TCP
            - name: webrtc-ice
              containerPort: 8189
              protocol: UDP
            - name: srt
              containerPort: 8890
              protocol: UDP
          env:
            - name: MTX_AUTHINTERNALUSERS_0_USER
              valueFrom:
                secretKeyRef:
                  name: sylora-streaming-secrets
                  key: publisher-username
            - name: MTX_AUTHINTERNALUSERS_0_PASS
              valueFrom:
                secretKeyRef:
                  name: sylora-streaming-secrets
                  key: publisher-password
            - name: MTX_AUTHINTERNALUSERS_1_USER
              valueFrom:
                secretKeyRef:
                  name: sylora-streaming-secrets
                  key: viewer-username
            - name: MTX_AUTHINTERNALUSERS_1_PASS
              valueFrom:
                secretKeyRef:
                  name: sylora-streaming-secrets
                  key: viewer-password
            - name: MTX_AUTHINTERNALUSERS_2_USER
              valueFrom:
                secretKeyRef:
                  name: sylora-streaming-secrets
                  key: mediamtx-api-username
            - name: MTX_AUTHINTERNALUSERS_2_PASS
              valueFrom:
                secretKeyRef:
                  name: sylora-streaming-secrets
                  key: mediamtx-api-password
            - name: MTX_WEBRTCADDITIONALHOSTS
              valueFrom:
                configMapKeyRef:
                  name: sylora-streaming-config
                  key: MEDIAMTX_WEBRTC_ADDITIONAL_HOSTS
            - name: MTX_WEBRTCICESERVERS2_0_URL
              valueFrom:
                secretKeyRef:
                  name: sylora-streaming-secrets
                  key: turn-url
            - name: MTX_WEBRTCICESERVERS2_0_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sylora-streaming-secrets
                  key: turn-username
            - name: MTX_WEBRTCICESERVERS2_0_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sylora-streaming-secrets
                  key: turn-secret
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: "4"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: streaming-config
              mountPath: /mediamtx.yml
              subPath: mediamtx.yml
              readOnly: true
            - name: recordings
              mountPath: /recordings
            - name: mediamtx-tmp
              mountPath: /tmp
          startupProbe:
            tcpSocket:
              port: rtmp
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 3
          readinessProbe:
            tcpSocket:
              port: rtmp
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: rtmp
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 10
        - name: recording-uploader
          image: rclone/rclone:1.74.4
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - /etc/sylora/upload-recordings.sh
          ports:
            - name: upload-metrics
              containerPort: 5572
              protocol: TCP
          env:
            - name: HOME
              value: /tmp
            - name: RECORDING_S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: sylora-streaming-config
                  key: RECORDING_S3_BUCKET
            - name: RECORDING_S3_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: sylora-streaming-config
                  key: RECORDING_S3_PREFIX
            - name: UPLOAD_INTERVAL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: sylora-streaming-config
                  key: RECORDING_UPLOAD_INTERVAL_SECONDS
            - name: RCLONE_CONFIG_RECORDINGS_TYPE
              value: s3
            - name: RCLONE_CONFIG_RECORDINGS_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: sylora-streaming-config
                  key: RECORDING_S3_PROVIDER
            - name: RCLONE_CONFIG_RECORDINGS_ENV_AUTH
              value: "false"
            - name: RCLONE_CONFIG_RECORDINGS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: sylora-streaming-secrets
                  key: recording-s3-access-key-id
            - name: RCLONE_CONFIG_RECORDINGS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: sylora-streaming-secrets
                  key: recording-s3-secret-access-key
            - name: RCLONE_CONFIG_RECORDINGS_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: sylora-streaming-secrets
                  key: recording-s3-endpoint
            - name: RCLONE_CONFIG_RECORDINGS_REGION
              valueFrom:
                configMapKeyRef:
                  name: sylora-streaming-config
                  key: RECORDING_S3_REGION
            - name: RCLONE_CONFIG_RECORDINGS_ACL
              value: private
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: streaming-config
              mountPath: /etc/sylora/upload-recordings.sh
              subPath: upload-recordings.sh
              readOnly: true
            - name: recordings
              mountPath: /recordings
            - name: uploader-tmp
              mountPath: /tmp
            - name: uploader-config
              mountPath: /config
          startupProbe:
            httpGet:
              path: /metrics
              port: upload-metrics
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /metrics
              port: upload-metrics
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: upload-metrics
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: streaming-config
          configMap:
            name: sylora-streaming-config
            defaultMode: 0555
        - name: recordings
          persistentVolumeClaim:
            claimName: sylora-mediamtx-recordings
        - name: mediamtx-tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: uploader-tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: uploader-config
          emptyDir:
            sizeLimit: 16Mi
