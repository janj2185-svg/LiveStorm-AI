<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SYLORA Live</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <style>
    :root {
      --ink: #1c1712;
      --cream: #f7f1e8;
      --champagne: #c4a574;
      --glass: rgba(255, 252, 246, 0.72);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(196, 165, 116, 0.35), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(88, 72, 52, 0.18), transparent 50%),
        linear-gradient(165deg, #fbf7f0 0%, #ebe2d4 48%, #e4d8c6 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }
    .brand {
      font-size: clamp(2rem, 6vw, 3.2rem);
      letter-spacing: 0.18em;
      font-weight: 600;
      margin: 8px 0 4px;
    }
    .sub {
      opacity: 0.7;
      margin-bottom: 20px;
      font-size: 0.95rem;
    }
    .stage {
      width: min(960px, 100%);
      background: var(--glass);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(196, 165, 116, 0.35);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(28, 23, 18, 0.12);
    }
    video {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #0f0d0b;
      display: block;
    }
    .meta {
      padding: 14px 18px 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }
    .status { font-size: 0.9rem; opacity: 0.8; }
    .btn {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 10px 18px;
      background: linear-gradient(135deg, #c4a574, #a8895a);
      color: #1c1712;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      font-family: inherit;
    }
    .err { color: #8b2e2e; padding: 12px 18px; }
  </style>
</head>
<body>
  <div class="brand">SYLORA</div>
  <div class="sub">Live watch</div>
  <div class="stage">
    <video id="player" controls playsinline autoplay muted></video>
    <div class="meta">
      <div class="status" id="status">Connecting…</div>
      <a class="btn" href="https://getsylora.com/">Open SYLORA</a>
    </div>
    <div class="err" id="err" hidden></div>
  </div>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const src = params.get("src") || params.get("hls");
      const statusEl = document.getElementById("status");
      const errEl = document.getElementById("err");
      const video = document.getElementById("player");
      if (!src) {
        statusEl.textContent = "Missing stream link";
        errEl.hidden = false;
        errEl.textContent = "Open a share link from Creator Studio, or pass ?src= to an HLS URL.";
        return;
      }
      statusEl.textContent = "Loading stream…";
      if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = src;
        video.addEventListener("loadedmetadata", function () {
          statusEl.textContent = "Live";
          video.play().catch(function () {});
        });
        return;
      }
      if (window.Hls && Hls.isSupported()) {
        const hls = new Hls({ enableWorker: true, lowLatencyMode: true });
        hls.loadSource(src);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function () {
          statusEl.textContent = "Live";
          video.play().catch(function () {});
        });
        hls.on(Hls.Events.ERROR, function (_e, data) {
          if (data.fatal) {
            statusEl.textContent = "Stream unavailable";
            errEl.hidden = false;
            errEl.textContent = "Waiting for the host to go live, or the link expired.";
          }
        });
        return;
      }
      statusEl.textContent = "Unsupported browser";
      errEl.hidden = false;
      errEl.textContent = "Use Safari, Chrome, or Edge to watch this stream.";
    })();
  </script>
</body>
</html>
