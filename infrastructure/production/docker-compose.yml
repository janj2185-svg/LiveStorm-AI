# SYLORA production stack — Hetzner Ubuntu 24.04 + Docker Compose
#
# Services: Caddy (HTTPS / Cloudflare), Flutter web, API x2, migrate,
# PostgreSQL 16, Redis 7, backup (R2/S3), optional log shipper stub.
#
# Do NOT commit the filled .env. Do NOT run on ephemeral Cursor VMs.

name: sylora-production

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "7"
    tag: "{{.Name}}"

x-api-env: &api-env
  ENVIRONMENT: "${APP_ENVIRONMENT:-production}"
  DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
  REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
  CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD}@redis:6379/1"
  CELERY_RESULT_BACKEND: "redis://:${REDIS_PASSWORD}@redis:6379/2"
  WEB_BASE_URL: "https://${DOMAIN}"
  CORS_ORIGINS: "[\"https://${DOMAIN}\"]"
  ALLOWED_HOSTS: "[\"${DOMAIN}\"]"
  JWT_ISSUER: "https://${DOMAIN}"
  JWT_AUDIENCE: "${JWT_AUDIENCE:-sylora-api}"
  JWT_SECRET: "${JWT_SECRET}"
  DATA_ENCRYPTION_KEY: "${DATA_ENCRYPTION_KEY}"
  IP_HASH_KEY: "${IP_HASH_KEY}"
  SMTP_HOST: "${SMTP_HOST:-}"
  SMTP_PORT: "${SMTP_PORT:-587}"
  SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL:-}"
  SMTP_FROM_NAME: "${SMTP_FROM_NAME:-SYLORA}"
  SMTP_START_TLS: "${SMTP_START_TLS:-true}"
  SMTP_USE_TLS: "${SMTP_USE_TLS:-false}"
  SMTP_USERNAME: "${SMTP_USERNAME:-}"
  SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
  S3_ENDPOINT_URL: "${S3_ENDPOINT_URL}"
  S3_BUCKET: "${S3_BUCKET}"
  S3_REGION: "${S3_REGION:-auto}"
  S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID}"
  S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY}"
  S3_PRESIGN_SECONDS: "${S3_PRESIGN_SECONDS:-900}"
  TEST_STAND_MODE: "${TEST_STAND_MODE:-false}"
  TEST_STAND_AUTO_VERIFY_EMAIL: "${TEST_STAND_AUTO_VERIFY_EMAIL:-false}"
  TEST_STAND_SANDBOX_WALLET: "${TEST_STAND_SANDBOX_WALLET:-false}"
  TEST_STAND_SANDBOX_CREDIT_MINOR: "${TEST_STAND_SANDBOX_CREDIT_MINOR:-5000}"
  TEST_STAND_ENDS_AT: "${TEST_STAND_ENDS_AT:-}"
  TEST_STAND_BUG_REPORT_URL: "${TEST_STAND_BUG_REPORT_URL:-}"
  STAND_ARTIFACTS_ROOT: /artifacts/sylora-gift-100-originals
  BOOTSTRAP_SOFT_PING: "${BOOTSTRAP_SOFT_PING:-false}"
  OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
  API_WORKERS: "${API_WORKERS:-2}"
  API_LOG_LEVEL: "${API_LOG_LEVEL:-info}"
  LOG_FORMAT: json

services:
  caddy:
    image: ${CADDY_IMAGE:-caddy:2.8-alpine}
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: "${DOMAIN:?Set DOMAIN}"
      ACME_EMAIL: "${ACME_EMAIL:?Set ACME_EMAIL}"
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN:-}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./Caddyfile.cloudflare:/etc/caddy/Caddyfile.cloudflare:ro
      - caddy-data:/data
      - caddy-config:/config
      - web-dist:/srv/web:ro
      - caddy-logs:/var/log/caddy
    depends_on:
      api:
        condition: service_healthy
      api2:
        condition: service_healthy
      web:
        condition: service_completed_successfully
    networks:
      - edge
      - application
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Prefer Cloudflare DNS-01 Caddyfile when token is present (selected by deploy.sh).
    command:
      [
        "caddy",
        "run",
        "--config",
        "${CADDY_CONFIG_FILE:-/etc/caddy/Caddyfile}",
        "--adapter",
        "caddyfile",
      ]

  web:
    image: ghcr.io/cirruslabs/flutter:stable
    working_dir: /build
    restart: "no"
    volumes:
      - ../../../apps/sylora:/build:ro
      - web-dist:/out
    environment:
      SYLORA_API_BASE_URL: "https://${DOMAIN}"
    entrypoint:
      - bash
      - -lc
      - |
        set -euo pipefail
        flutter config --enable-web
        flutter pub get
        flutter build web --release --dart-define=SYLORA_API_BASE_URL=https://${DOMAIN}
        rm -rf /out/*
        cp -a build/web/. /out/
        echo "web build complete"
    networks:
      - application
    logging: *default-logging

  api-image:
    build:
      context: ../../../services/api
      dockerfile: ../../infrastructure/docker/api.Dockerfile
    image: sylora-api:${IMAGE_TAG:-production}
    entrypoint: ["true"]
    restart: "no"
    networks:
      - application

  migrate:
    image: sylora-api:${IMAGE_TAG:-production}
    restart: "no"
    env_file: [.env]
    environment:
      <<: *api-env
    volumes:
      - ../../../services/api:/src:ro
    working_dir: /src
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
      api-image:
        condition: service_completed_successfully
    networks:
      - data
    logging: *default-logging

  api:
    image: sylora-api:${IMAGE_TAG:-production}
    build:
      context: ../../../services/api
      dockerfile: ../../infrastructure/docker/api.Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      <<: *api-env
    volumes:
      - ../../../artifacts/sylora-gift-100-originals:/artifacts/sylora-gift-100-originals:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks:
      - application
      - data
    logging: *default-logging

  api2:
    image: sylora-api:${IMAGE_TAG:-production}
    restart: unless-stopped
    env_file: [.env]
    environment:
      <<: *api-env
    volumes:
      - ../../../artifacts/sylora-gift-100-originals:/artifacts/sylora-gift-100-originals:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks:
      - application
      - data
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-backup-tmp:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - data
    logging: *default-logging
    command:
      - postgres
      - -c
      - logging_collector=on
      - -c
      - log_destination=stderr
      - -c
      - log_min_duration_statement=500
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=200

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD}",
        "--appendonly",
        "yes",
        "--maxmemory",
        "${REDIS_MAXMEMORY:-512mb}",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - data
    logging: *default-logging

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: [.env]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: "${POSTGRES_DB}"
      PGUSER: "${POSTGRES_USER}"
      PGPASSWORD: "${POSTGRES_PASSWORD}"
      S3_BUCKET: "${BACKUP_S3_BUCKET:-${S3_BUCKET}}"
      S3_PREFIX: "${BACKUP_S3_PREFIX:-postgres/sylora}"
      AWS_ACCESS_KEY_ID: "${BACKUP_S3_ACCESS_KEY_ID:-${S3_ACCESS_KEY_ID}}"
      AWS_SECRET_ACCESS_KEY: "${BACKUP_S3_SECRET_ACCESS_KEY:-${S3_SECRET_ACCESS_KEY}}"
      AWS_DEFAULT_REGION: "${S3_REGION:-auto}"
      AWS_ENDPOINT_URL: "${BACKUP_S3_ENDPOINT_URL:-${S3_ENDPOINT_URL}}"
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-14}"
      BACKUP_CRON: "${BACKUP_CRON:-0 */6 * * *}"
    volumes:
      - ./scripts/backup-loop.sh:/usr/local/bin/backup-loop.sh:ro
      - ../../../infrastructure/scripts/backup-postgres.sh:/usr/local/bin/backup-postgres.sh:ro
      - ../../../infrastructure/scripts/restore-postgres.sh:/usr/local/bin/restore-postgres.sh:ro
      - postgres-backup-tmp:/backups
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -lc
      - |
        set -euo pipefail
        apk add --no-cache aws-cli bash curl ca-certificates python3 >/dev/null
        chmod +x /usr/local/bin/backup-loop.sh /usr/local/bin/backup-postgres.sh
        exec /usr/local/bin/backup-loop.sh
    networks:
      - data
    logging: *default-logging

networks:
  edge:
  application:
  data:

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
  caddy-logs:
  web-dist:
  postgres-backup-tmp:
