# SYLORA edge nginx — restored Flutter + FastAPI + MediaMTX behind Cloudflare
map $http_x_forwarded_proto $sylora_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream sylora_frontend {
    server sylora-restored-web-preview-1:80;
}

upstream sylora_api {
    server sylora-restored-api-1:8000;
}

upstream sylora_mediamtx_hls {
    server sylora-restored-mediamtx-1:8888;
}

upstream sylora_mediamtx_webrtc {
    server sylora-restored-mediamtx-1:8889;
}

server {
    listen 80;
    listen [::]:80;
    server_name getsylora.com www.getsylora.com 46.225.84.210 _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://getsylora.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name getsylora.com www.getsylora.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    if ($host = www.getsylora.com) {
        return 301 https://getsylora.com$request_uri;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location = /health {
        proxy_pass http://sylora_api/health/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $sylora_forwarded_proto;
    }

    location /health/ {
        proxy_pass http://sylora_api/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $sylora_forwarded_proto;
    }

    location /v1/ {
        proxy_pass http://sylora_api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # MediaMTX HLS (friend watch). Strip Authorization so anonymous read works.
    location /hls/ {
        proxy_pass http://sylora_mediamtx_hls/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Content-Type" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # MediaMTX WHIP/WHEP + reader page. Strip Authorization for open stand publish.
    location /webrtc/ {
        proxy_pass http://sylora_mediamtx_webrtc/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location / {
        proxy_pass http://sylora_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        return 301 https://getsylora.com$request_uri;
    }
}
